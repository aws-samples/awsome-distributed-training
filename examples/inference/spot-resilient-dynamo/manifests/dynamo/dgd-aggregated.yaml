# DynamoGraphDeployment — aggregated single-worker serving
# Qwen2.5-3B-Instruct on a Spot GPU node
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen-spot
  namespace: dynamo
spec:
  backendFramework: vllm

  components:
    # Frontend (system node)
    - name: frontend
      type: frontend
      podTemplate:
        spec:
          nodeSelector:
            role: system
          containers:
          - name: main
            image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.1

    # Aggregated worker (GPU Spot node)
    - name: worker
      type: worker
      runtimeVersionOverride: "1.5.1"
      podTemplate:
        spec:
          nodeSelector:
            role: gpu-spot
          terminationGracePeriodSeconds: 90
          containers:
          - name: main
            image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1
            args:
            - "python -m dynamo.vllm --model Qwen/Qwen2.5-3B-Instruct --max-model-len 8192 --gpu-memory-utilization 0.85"
            env:
            - name: DYN_RUNTIME_GRACEFUL_SHUTDOWN_TIMEOUT_SECS
              value: "60"
            resources:
              limits:
                nvidia.com/gpu: "1"
            volumeMounts:
            - name: shm
              mountPath: /dev/shm
          volumes:
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 4Gi
